apiVersion: apps/v1
kind: Deployment
metadata:
  name: dormitory-helper-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dormitory-helper-backend
  template:
    metadata:
      labels:
        app: dormitory-helper-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: backend
          image: dormitory-helper-backend:v1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          envFrom:
            - configMapRef:
                name: dormitory-helper-config
            - secretRef:
                name: dormitory-helper-secret
          env:
            - name: SLI_DEMO_ENABLED
              value: "true"
            - name: SLI_DEMO_DELAY_SECONDS
              value: "1.5"
