# React раздаётся как статические файлы, поэтому логи frontend-контейнера —
# это access-логи Nginx. Каждая строка stdout содержит один JSON-объект.
log_format structured escape=json
    '{"timestamp":"$time_iso8601",'
    '"level":"info",'
    '"message":"HTTP-запрос завершён",'
    '"service.name":"dormitory-helper-frontend",'
    '"event":"http.request.completed",'
    '"http.request.method":"$request_method",'
    '"url.path":"$uri",'
    '"http.response.status_code":$status,'
    '"http.response.body.bytes":$body_bytes_sent,'
    '"duration_seconds":$request_time,'
    '"client.address":"$remote_addr",'
    '"user_agent.original":"$http_user_agent",'
    '"http.request.id":"$request_id"}';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout structured;
    error_log /dev/stderr crit;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
