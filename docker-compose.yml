x-backend-environment: &backend-environment
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-dormitory_helper}
  POSTGRES_USER: ${POSTGRES_USER:-app}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-development-secret-change-me}
  ALGORITHM: ${ALGORITHM:-HS256}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dormitory_helper}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    ports:
      - "${POSTGRES_PORT_EXTERNAL:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-init:
    image: dormitory-helper-backend:local
    build: ./backend
    command: ["python", "manage.py"]
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    image: dormitory-helper-backend:local
    build: ./backend
    environment: *backend-environment
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build: ./announcement-app
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
